<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <style>
    .ln { opacity:0; animation: fade 0.35s ease forwards; }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
  </style>
  <rect width="780" height="460" fill="#0d1117" rx="10"/>
  <rect width="780" height="34" fill="#161b22" rx="10"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="300" y="21" fill="#8b949e" font-size="12">hy3-cli — demo preview (mock)</text>
  <text x="24" y="70" fill="#58a6ff" class="ln" style="animation-delay:0.00s">⚡ Hy3-CLI  — natural language → shell, powered by Hy3</text>
  <text x="24" y="92" fill="#7ee787" class="ln" style="animation-delay:0.77s">$ hy3cli "找出当前目录下最近7天修改、大于100MB的文件"</text>
  <text x="24" y="114" fill="#c9d1d9" class="ln" style="animation-delay:1.54s"></text>
  <text x="24" y="136" fill="#c9d1d9" class="ln" style="animation-delay:2.31s">💡 Hy3 生成的命令</text>
  <text x="24" y="158" fill="#ffa657" class="ln" style="animation-delay:3.08s">$ find . -type f -mtime -7 -size +100M -print0 | xargs -0 ls -lh</text>
  <text x="24" y="180" fill="#c9d1d9" class="ln" style="animation-delay:3.85s">说明: 查找当前目录下 7 天内修改、大于 100MB 的文件并以易读大小列出。</text>
  <text x="24" y="202" fill="#c9d1d9" class="ln" style="animation-delay:4.62s">风险等级: LOW   低风险：只读或安全的常规操作</text>
  <text x="24" y="224" fill="#c9d1d9" class="ln" style="animation-delay:5.39s">注意: • 仅列举，不会删除或修改任何文件</text>
  <text x="24" y="246" fill="#7ee787" class="ln" style="animation-delay:6.16s">$ hy3cli "查看占用 8080 端口的进程并杀掉"</text>
  <text x="24" y="268" fill="#c9d1d9" class="ln" style="animation-delay:6.93s"></text>
  <text x="24" y="290" fill="#c9d1d9" class="ln" style="animation-delay:7.70s">💡 Hy3 生成的命令</text>
  <text x="24" y="312" fill="#ffa657" class="ln" style="animation-delay:8.47s">$ lsof -ti :8080 | xargs -r ps -p</text>
  <text x="24" y="334" fill="#c9d1d9" class="ln" style="animation-delay:9.24s">说明: 列出占用 8080 端口的进程详情；如需结束可追加 | xargs kill。</text>
  <text x="24" y="356" fill="#c9d1d9" class="ln" style="animation-delay:10.01s">风险等级: MEDIUM   中风险：会改变状态 / 需权限，请确认后再执行</text>
  <text x="24" y="378" fill="#c9d1d9" class="ln" style="animation-delay:10.78s">注意: • 杀进程前请确认 PID   • kill 会终止目标进程</text>
  <text x="24" y="400" fill="#58a6ff" class="ln" style="animation-delay:11.55s">✅ 两个端到端流程跑通（真实视频请用 demo/record.sh 录制）</text>
</svg>